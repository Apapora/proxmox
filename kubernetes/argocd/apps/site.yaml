apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: site
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Apapora/proxmox.git
    targetRevision: main
    path: kubernetes/apps/site
  destination:
    server: https://kubernetes.default.svc
    namespace: site
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
