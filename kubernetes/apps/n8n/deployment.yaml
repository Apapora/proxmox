apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-data
      containers:
        - name: n8n
          image: docker.n8n.io/n8nio/n8n:latest
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n

          env:
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: encryption-key
            - name: WEBHOOK_URL
              value: https://n8n.chad-johnston.com
            - name: N8N_HOST
              value: n8n.chad-johnston.com
            - name: N8N_PROTOCOL
              value: https
            - name: N8N_PORT
              value: "5678"
          ports:
            - containerPort: 5678
