apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: nocodb
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: nocodb
            - name: POSTGRES_DB
              value: nocodb
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nocodb-secrets
                  key: postgres-password
            # Subdir keeps PGDATA off the volume root (avoids lost+found clash).
            - name: PGDATA
              value: /var/lib/postgresql/18/docker
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "nocodb", "-d", "nocodb"]
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 8Gi