apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless
  strategy:
    type: Recreate          # RWO PVCs — never two pods holding the same volume
  template:
    metadata:
      labels:
        app: paperless
    spec:
      # k8s injects Docker-legacy <SVC>_PORT env vars for every Service. The
      # `paperless` Service would set PAPERLESS_PORT=tcp://<ip>:8000, which
      # paperless-ngx misreads as its gunicorn listen port → crash. Disabling
      # service links drops that whole legacy-env class. (cf. immich REDIS/DB_PORT.)
      enableServiceLinks: false
      containers:
        - name: paperless
          image: ghcr.io/paperless-ngx/paperless-ngx:2.14
          ports:
            - containerPort: 8000
          env:
            # Match the NFS export ownership (1000:1000 on /data/paperless).
            - name: USERMAP_UID
              value: "1000"
            - name: USERMAP_GID
              value: "1000"
            - name: PAPERLESS_TIME_ZONE
              value: Etc/UTC
            - name: PAPERLESS_OCR_LANGUAGE
              value: eng
            - name: PAPERLESS_URL
              value: https://paperless.chad-johnston.com
            - name: PAPERLESS_REDIS
              value: redis://redis:6379
            - name: PAPERLESS_DBHOST
              value: postgres
            - name: PAPERLESS_DBNAME
              value: paperless
            - name: PAPERLESS_DBUSER
              value: paperless
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: paperless-secret
                  key: postgres-password
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-secret
                  key: paperless-secret-key
            # Auto-creates the superuser on first boot.
            - name: PAPERLESS_ADMIN_USER
              value: admin
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless-secret
                  key: admin-password
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
            - name: consume
              mountPath: /usr/src/paperless/consume
          readinessProbe:
            httpGet:
              path: /accounts/login/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 10
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "2"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-data
        - name: media
          persistentVolumeClaim:
            claimName: paperless-media
        # Web-upload only — consume folder is transient, no PVC needed.
        - name: consume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: paperless
  namespace: paperless
spec:
  selector:
    app: paperless
  ports:
    - port: 8000
      targetPort: 8000
