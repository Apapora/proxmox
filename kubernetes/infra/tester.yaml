---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-md-test
spec: 
  selector:
    matchLabels:
      app: nginx-test
  replicas: 2
  template:
    metadata:
      labels:
        app: nginx-test
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80

---

apiVersion: v1 
kind: Service
metadata:
  name: nginx-test-svc 
spec:
  type: ClusterIP
  selector:
      app: nginx-test
  ports:
    - port: 80
      targetPort: 80

---

apiVersion: gateway.networking.k8s.io/v1 
kind: HTTPRoute
metadata:
  name: nginx-test
  namespace: default
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames: 
    - "nginx.test.local"
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
        - name: nginx-test-svc 
          port: 80