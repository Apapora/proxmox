apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-immich
provisioner: nfs.csi.k8s.io
parameters:
  server: 10.0.0.19
  share: /data/immich-library
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - nfsvers=4.1
  - hard
  - timeo=600
  - retrans=2
  - noresvport
