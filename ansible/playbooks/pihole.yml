---
- name: install + configure pihole
  hosts: pihole
  vars_prompt:
    - name: pihole_admin_password
      prompt: Pi-hole admin password
      private: true
  vars:
    pihole_interface: eth0
    pihole_ipv4: 10.0.0.160/24
    pihole_dns_upstream:
      - 1.1.1.1
      - 9.9.9.9
    pihole_local_zone: chad-johnston.com
    pihole_local_target: 10.0.0.200

  tasks:
    - name: install prereqs
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
        state: present
        update_cache: true

    - name: ensure /etc/pihole exists
      ansible.builtin.file:
        path: /etc/pihole
        state: directory
        mode: "0755"

    - name: write setupVars.conf
      ansible.builtin.copy:
        dest: /etc/pihole/setupVars.conf
        mode: "0644"
        content: |
          PIHOLE_INTERFACE={{ pihole_interface }}
          IPV4_ADDRESS={{ pihole_ipv4 }}
          IPV6_ADDRESS=
          PIHOLE_DNS_1={{ pihole_dns_upstream[0] }}
          PIHOLE_DNS_2={{ pihole_dns_upstream[1] }}
          QUERY_LOGGING=true
          INSTALL_WEB_SERVER=true
          INSTALL_WEB_INTERFACE=true
          LIGHTTPD_ENABLED=true
          BLOCKING_ENABLED=true
          DNSMASQ_LISTENING=local

    - name: install Pi-hole unattended
      ansible.builtin.shell: |
        curl -sSL https://install.pi-hole.net | bash /dev/stdin --unattended
      args:
        creates: /usr/local/bin/pihole

    - name: set admin password
      ansible.builtin.command: "pihole -a -p {{ pihole_admin_password }}"
      no_log: true
      changed_when: false

    - name: enable /etc/dnsmasq.d loading in pihole v6
      ansible.builtin.replace:
        path: /etc/pihole/pihole.toml
        regexp: "etc_dnsmasq_d = false"
        replace: "etc_dnsmasq_d = true"
      notify: restart pihole dns

    - name: write custom dnsmasq config for wildcard local DNS
      ansible.builtin.copy:
        dest: /etc/dnsmasq.d/02-homelab.conf
        mode: "0644"
        content: |
          address=/.{{ pihole_local_zone }}/{{ pihole_local_target }}
      notify: restart pihole dns

  handlers:
    - name: restart pihole dns
      ansible.builtin.command: pihole restartdns
