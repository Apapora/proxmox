          - delay: "00:00:00.3"
          - action: switch.turn_off
            target:
              entity_id: switch.blind_all_stop
  # Area-assignable wrappers for the Crestron lights. The raw crestron
  # switch/light entities have no unique_id (can't be put in an Area or
  # renamed), so these template entities wrap them, carry a unique_id, and
  # are what you assign to the Living Room area + expose to voice.
  # Hide the underlying switch.light_* / light.light_2/3 entities in the UI.
  - switch:
      - name: "Center Light"
        unique_id: lr_center_light
        state: "{{ is_state('switch.light_center', 'on') }}"
        turn_on:
          - action: switch.turn_on
            target: { entity_id: switch.light_center }
        turn_off:
          - action: switch.turn_off
            target: { entity_id: switch.light_center }
      - name: "Window Light"
        unique_id: lr_window_light
        state: "{{ is_state('switch.light_window', 'on') }}"
        turn_on:
          - action: switch.turn_on
            target: { entity_id: switch.light_window }
        turn_off:
          - action: switch.turn_off
            target: { entity_id: switch.light_window }
      - name: "Entry Light"
        unique_id: lr_entry_light
        state: "{{ is_state('switch.light_entry', 'on') }}"
        turn_on:
          - action: switch.turn_on
            target: { entity_id: switch.light_entry }
        turn_off:
          - action: switch.turn_off
            target: { entity_id: switch.light_entry }
      - name: "Study Light"
        unique_id: lr_study_light
        state: "{{ is_state('switch.light_study', 'on') }}"
        turn_on:
          - action: switch.turn_on
            target: { entity_id: switch.light_study }
        turn_off:
          - action: switch.turn_off
            target: { entity_id: switch.light_study }
  - light:
      - name: "Front Light"
        unique_id: lr_front_light
        state: "{{ states('light.light_2') }}"
        level: "{{ state_attr('light.light_2', 'brightness') | int(0) }}"
        turn_on:
          - action: light.turn_on
            target: { entity_id: light.light_2 }
        turn_off:
          - action: light.turn_off
            target: { entity_id: light.light_2 }
        set_level:
          - action: light.turn_on
            target: { entity_id: light.light_2 }
            data:
              brightness: "{{ brightness }}"
      - name: "Back Light"
        unique_id: lr_back_light
        state: "{{ states('light.light_3') }}"
        level: "{{ state_attr('light.light_3', 'brightness') | int(0) }}"
        turn_on:
          - action: light.turn_on
            target: { entity_id: light.light_3 }
        turn_off:
          - action: light.turn_off
            target: { entity_id: light.light_3 }
        set_level:
          - action: light.turn_on
            target: { entity_id: light.light_3 }
            data:
              brightness: "{{ brightness }}"

light:
  - platform: crestron
    name: "Light 2"
    brightness_join: 1      # analog join
    type: brightness
  - platform: crestron
    name: "Light 3"
    brightness_join: 2     # analog join
    type: brightness
