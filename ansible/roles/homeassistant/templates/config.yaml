          - delay: "00:00:00.3"
          - action: switch.turn_off
            target:
              entity_id: switch.blind_l1_up
        close_cover:
          - action: switch.turn_on
            target:
              entity_id: switch.blind_l1_down
          - delay: "00:00:00.3"
          - action: switch.turn_off
            target:
              entity_id: switch.blind_l1_down
        stop_cover:
          - action: switch.turn_on
            target:
              entity_id: switch.blind_l1_stop
          - delay: "00:00:00.3"
          - action: switch.turn_off
            target:
              entity_id: switch.blind_l1_stop
      - name: "Blind L2"
        unique_id: crestron_blind_l2
        device_class: blind
        open_cover:
          - action: switch.turn_on
            target:
              entity_id: switch.blind_l2_up
          - delay: "00:00:00.3"
          - action: switch.turn_off
            target:
              entity_id: switch.blind_l2_up
        close_cover:
          - action: switch.turn_on
