# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

logger:
  default: info
  logs:
    custom_components.crestron: debug

crestron:
  port:
    16384
    # for syncing HA state to control system joins
    #to_joins:
    #...
    # for invoking HA scripts when control system joins change
    #from_joins:
    #...

binary_sensor:
  # Raw Crestron Hardware Feedback Channels (dig_in)
  # device_class is REQUIRED by npope's binary_sensor schema (no default) —
  # omit it and the whole crestron.binary_sensor platform fails to load.
  - platform: crestron
    name: "Light Center FB"
    is_on_join: 3
    device_class: light
  - platform: crestron
    name: "Light Window FB"
    is_on_join: 6
    device_class: light
  - platform: crestron
    name: "Light Entry FB"
    is_on_join: 7
    device_class: light
  - platform: crestron
    name: "Light Study FB"
    is_on_join: 8
    device_class: light

switch:
  # Raw Crestron Hardware Command Channels (dig_out)
  # NOTE: joins are +2 vs the ISC dig_out pin number — the two analog joins
  # (aout1/aout2 = Light2/3 dimmer levels) occupy XSIG join positions 1-2 on
  # the single Intersystem Communications symbol, shifting every digital join
  # up by 2. So switch_join = (dig_out pin) + 2. e.g. Light1_On=dig_out1 -> 3.
  #
  # Momentary intent pairs: each light has an ON pulse join (HA_On) and an
  # OFF pulse join (HA_Off) into its LightSync module. Template lights below
  # pulse these; LightSync tracks real state via Light#_FB -> binary_sensor.
  # Off joins sit above the blind range (dig_out 28-31) to avoid collision.
  - platform: crestron
    name: "Light Center On"
    switch_join: 3 # dig_out 1  -> HA_On
  - platform: crestron
    name: "Light Center Off"
    switch_join: 30 # dig_out 28 -> HA_Off
  - platform: crestron
    name: "Light Window On"
    switch_join: 6 # dig_out 4  -> HA_On
  - platform: crestron
    name: "Light Window Off"
    switch_join: 31 # dig_out 29 -> HA_Off
  - platform: crestron
    name: "Light Entry On"
    switch_join: 7 # dig_out 5  -> HA_On
  - platform: crestron
    name: "Light Entry Off"
    switch_join: 32 # dig_out 30 -> HA_Off
  - platform: crestron
    name: "Light Study On"
    switch_join: 8 # dig_out 6  -> HA_On
  - platform: crestron
    name: "Light Study Off"
    switch_join: 33 # dig_out 31 -> HA_Off

  # Blinds
  - platform: crestron
    name: "Blind R2 Up"
    switch_join: 9
  - platform: crestron
    name: "Blind R2 Stop"
    switch_join: 10
  - platform: crestron
    name: "Blind R2 Down"
    switch_join: 11
  - platform: crestron
    name: "Blind R1 Up"
    switch_join: 12
  - platform: crestron
    name: "Blind R1 Stop"
    switch_join: 13
  - platform: crestron
    name: "Blind R1 Down"
    switch_join: 14
  - platform: crestron
    name: "Blind M Up"
    switch_join: 15
  - platform: crestron
    name: "Blind M Stop"
    switch_join: 16
  - platform: crestron
    name: "Blind M Down"
    switch_join: 17

  - platform: crestron
    name: "Blind L1 Up"
    switch_join: 18
  - platform: crestron
    name: "Blind L1 Stop"
    switch_join: 19
  - platform: crestron
    name: "Blind L1 Down"
    switch_join: 20
  - platform: crestron
    name: "Blind L2 Up"
    switch_join: 21
  - platform: crestron
    name: "Blind L2 Stop"
    switch_join: 22
  - platform: crestron
    name: "Blind L2 Down"
    switch_join: 23
  - platform: crestron
    name: "Blind Study Up"
    switch_join: 24
  - platform: crestron
    name: "Blind Study Stop"
    switch_join: 25
  - platform: crestron
    name: "Blind Study Down"
    switch_join: 26
  # All-blinds group (single command drives every blind via COM B broadcast)
  - platform: crestron
    name: "Blind All Up"
    switch_join: 27
  - platform: crestron
    name: "Blind All Stop"
    switch_join: 28
  - platform: crestron
    name: "Blind All Down"
    switch_join: 29

template:
  - cover:
      - name: "Blind R2"
        unique_id: crestron_blind_r2
        device_class: blind
        open_cover:
          - action: switch.turn_on
            target:
              entity_id: switch.blind_r2_up
          - delay: "00:00:00.3"
          - action: switch.turn_off
            target:
              entity_id: switch.blind_r2_up
        close_cover:
          - action: switch.turn_on
            target:
              entity_id: switch.blind_r2_down
          - delay: "00:00:00.3"
          - action: switch.turn_off
            target:
              entity_id: switch.blind_r2_down
        stop_cover:
          - action: switch.turn_on
            target:
              entity_id: switch.blind_r2_stop
          - delay: "00:00:00.3"
          - action: switch.turn_off
            target:
              entity_id: switch.blind_r2_stop
      - name: "Blind R1"
        unique_id: crestron_blind_r1
        device_class: blind
        open_cover:
          - action: switch.turn_on
            target:
              entity_id: switch.blind_r1_up
          - delay: "00:00:00.3"
          - action: switch.turn_off
            target:
              entity_id: switch.blind_r1_up
        close_cover:
          - action: switch.turn_on
            target:
              entity_id: switch.blind_r1_down
          - delay: "00:00:00.3"
          - action: switch.turn_off
            target:
              entity_id: switch.blind_r1_down
        stop_cover:
