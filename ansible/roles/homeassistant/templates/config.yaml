          - delay: "00:00:00.3"
          - action: switch.turn_off
            target:
              entity_id: switch.blind_all_stop

  - light:
      # Unified Area-assignable Lights (Binary On/Off + Analog Dimmers combined)
      # Momentary intent: turn_on pulses the ON join, turn_off pulses the OFF
      # join (0.3s), guaranteeing a fresh rising edge into LightSync every
      # time. State is real feedback from the load via binary_sensor.
      - name: "Center Light"
        unique_id: lr_center_light
        state: "{{ is_state('binary_sensor.light_center_fb', 'on') }}"
        turn_on:
          - action: switch.turn_on
            target: { entity_id: switch.light_center_on }
          - delay: "00:00:00.3"
          - action: switch.turn_off
            target: { entity_id: switch.light_center_on }
        turn_off:
          - action: switch.turn_on
            target: { entity_id: switch.light_center_off }
          - delay: "00:00:00.3"
          - action: switch.turn_off
            target: { entity_id: switch.light_center_off }

      - name: "Window Light"
        unique_id: lr_window_light
        state: "{{ is_state('binary_sensor.light_window_fb', 'on') }}"
        turn_on:
          - action: switch.turn_on
            target: { entity_id: switch.light_window_on }
          - delay: "00:00:00.3"
          - action: switch.turn_off
            target: { entity_id: switch.light_window_on }
        turn_off:
          - action: switch.turn_on
            target: { entity_id: switch.light_window_off }
          - delay: "00:00:00.3"
          - action: switch.turn_off
            target: { entity_id: switch.light_window_off }

      - name: "Entry Light"
        unique_id: lr_entry_light
        state: "{{ is_state('binary_sensor.light_entry_fb', 'on') }}"
        turn_on:
          - action: switch.turn_on
            target: { entity_id: switch.light_entry_on }
          - delay: "00:00:00.3"
          - action: switch.turn_off
            target: { entity_id: switch.light_entry_on }
        turn_off:
          - action: switch.turn_on
            target: { entity_id: switch.light_entry_off }
          - delay: "00:00:00.3"
          - action: switch.turn_off
            target: { entity_id: switch.light_entry_off }

      - name: "Study Light"
        unique_id: lr_study_light
        state: "{{ is_state('binary_sensor.light_study_fb', 'on') }}"
        turn_on:
          - action: switch.turn_on
            target: { entity_id: switch.light_study_on }
          - delay: "00:00:00.3"
          - action: switch.turn_off
            target: { entity_id: switch.light_study_on }
        turn_off:
          - action: switch.turn_on
            target: { entity_id: switch.light_study_off }
          - delay: "00:00:00.3"
          - action: switch.turn_off
            target: { entity_id: switch.light_study_off }

      - name: "Front Light"
        unique_id: lr_front_light
        state: "{{ states('light.light_2') }}"
        level: "{{ state_attr('light.light_2', 'brightness') | int(0) }}"
        turn_on:
          - action: light.turn_on
            target: { entity_id: light.light_2 }
        turn_off:
          - action: light.turn_off
            target: { entity_id: light.light_2 }
        set_level:
          - action: light.turn_on
            target: { entity_id: light.light_2 }
            data:
              brightness: "{{ brightness }}"

      - name: "Back Light"
        unique_id: lr_back_light
        state: "{{ states('light.light_3') }}"
        level: "{{ state_attr('light.light_3', 'brightness') | int(0) }}"
        turn_on:
          - action: light.turn_on
            target: { entity_id: light.light_3 }
        turn_off:
          - action: light.turn_off
            target: { entity_id: light.light_3 }
        set_level:
          - action: light.turn_on
            target: { entity_id: light.light_3 }
            data:
              brightness: "{{ brightness }}"

light:
  # Raw Crestron Hardware Dimmer Profiles (analog joins)
  - platform: crestron
    name: "Light 2"
    brightness_join: 1
    type: brightness
  - platform: crestron
    name: "Light 3"
    brightness_join: 2
    type: brightness
