          - action: switch.turn_off
            target:
              entity_id: switch.blind_m_up
        close_cover:
          - action: switch.turn_on
            target:
              entity_id: switch.blind_m_down
          - delay: "00:00:00.3"
          - action: switch.turn_off
            target:
              entity_id: switch.blind_m_down
        stop_cover:
          - action: switch.turn_on
            target:
              entity_id: switch.blind_m_stop
          - delay: "00:00:00.3"
          - action: switch.turn_off
            target:
