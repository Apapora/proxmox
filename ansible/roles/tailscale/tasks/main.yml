---
# PREREQ (out-of-band, root@pam on PVE — NOT doable from here):
# unprivileged LXC needs /dev/net/tun passed through. Add to
# /etc/pve/lxc/<vmid>.conf then reboot the CT:
#   lxc.cgroup2.devices.allow: c 10:200 rwm
#   lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file
# Same constraint as the torrents stack (API token can't attach devices).

- name: install prereqs
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: ensure keyrings dir exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: "0755"

- name: install Tailscale GPG signing key
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL {{ tailscale_gpg_key_url }} -o /usr/share/keyrings/tailscale-archive-keyring.gpg
  args:
    creates: /usr/share/keyrings/tailscale-archive-keyring.gpg
    executable: /bin/bash

- name: add Tailscale apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: "0644"
    content: |
      # Tailscale packages for debian {{ ansible_distribution_release }}
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] {{ tailscale_repo_url }} {{ ansible_distribution_release }} main
  register: tailscale_repo_added

- name: refresh apt cache when repo changed
  ansible.builtin.apt:
    update_cache: true
  when: tailscale_repo_added.changed

- name: install tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present

- name: ensure tailscaled running + enabled
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true

- name: check tailscale backend state
  ansible.builtin.command: tailscale status --json
  register: tailscale_state
  changed_when: false
  failed_when: false

- name: derive backend state (Running = already authed)
  ansible.builtin.set_fact:
    tailscale_running: >-
      {{ (tailscale_state.rc == 0)
         and ((tailscale_state.stdout | from_json).BackendState | default('')) == 'Running' }}

- name: fail early if not authed and no auth key supplied
  ansible.builtin.fail:
    msg: >-
      Tailscale node is not logged in and tailscale_authkey is empty.
      Supply an auth key (-e tailscale_authkey=tskey-auth-...) or run
      `tailscale up` interactively on the host once.
  when:
    - not tailscale_running
    - tailscale_authkey | length == 0

- name: tailscale up (authenticate + set hostname)
  ansible.builtin.command: >-
    tailscale up
    --authkey={{ tailscale_authkey }}
    --hostname={{ tailscale_hostname }}
    {{ tailscale_up_args }}
  when:
    - not tailscale_running
    - tailscale_authkey | length > 0
  no_log: true
