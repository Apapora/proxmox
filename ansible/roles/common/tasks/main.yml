---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade installed packages (safe, no dist-upgrade)
  ansible.builtin.apt:
    upgrade: safe
    autoremove: true
    autoclean: true

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Ensure systemd-timesyncd is enabled and running
  ansible.builtin.service:
    name: systemd-timesyncd
    enabled: true
    state: started
  when: common_manage_ntp

- name: Configure unattended-upgrades (security only, no auto-reboot)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    owner: root
    group: root
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

- name: Ensure /run/sshd exists (needed by sshd -t validate; tmpfs on LXCs)
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Apply SSH hardening directives
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?\\s*{{ item.key }}\\b"
    line: "{{ item.key }} {{ item.value }}"
    state: present
    validate: /usr/sbin/sshd -t -f %s
  loop: "{{ common_ssh_config | dict2items }}"
  notify: Restart ssh

- name: Check for active swap
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: active_swap
  changed_when: false

- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  when:
    - common_disable_swap
    - active_swap.stdout | length > 0
  changed_when: true

- name: Comment out swap entries in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'
  when: common_disable_swap
